CONFIG_ZMK_KEYBOARD_NAME="arcturis"

# Set sleep timeout to 30min (30*60*1000ms)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Boost Bluetooth TX power, also make Bluetooth stronger
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Improves compatibility with iPad
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y

CONFIG_ZMK_MOUSE=y

# Uncomment the following line to enable USB Logging (this increases power usage
# by a significant amount, turn it off when not in use)
CONFIG_ZMK_USB_LOGGING=y
# Enable USB stack
CONFIG_USB=y
# Enable USB device support
CONFIG_USB_DEVICE_STACK=y
# Enable USB HID class driver
CONFIG_USB_DEVICE_HID=y
# Enable ZMK USB integration
CONFIG_ZMK_USB=y
# Optional: Enable console logs over USB (useful for debugging)
CONFIG_USB_DEVICE_PRODUCT="arcturis"
CONFIG_UART_CONSOLE=n
CONFIG_USB_CDC_ACM=n

# Optional: Enable N-Key Rollover (instead of 6KRO)
CONFIG_ZMK_HID_NKRO=y