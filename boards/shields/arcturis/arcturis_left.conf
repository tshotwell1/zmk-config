CONFIG_INPUT=y

# The left half is the BLE peripheral with respect to the host, so these govern
# the keyboard-to-computer link. Without them the Zephyr defaults apply (MIN 24
# / MAX 40, in 1.25ms units = a 30-50ms interval), which caps pointer reports at
# roughly 20-33Hz and makes the trackball feel sluggish over Bluetooth while
# being fine over USB. 6 = 7.5ms, the Bluetooth spec minimum.
# Costs some battery on this half, since the radio wakes up more often.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
