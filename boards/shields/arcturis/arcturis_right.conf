# Core dependencies
CONFIG_SPI=y
CONFIG_INPUT=y

# Enable the PMW3389 sensor driver
CONFIG_PMW3389=y

# ZMK pointing subsystem
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_EXT_POWER=y

# --- PMW3389 Power/Rest Mode Configuration ---
# Sampling interval while in REST1 state (fast sleep)
CONFIG_PMW3389_REST1_SAMPLE_TIME_MS=100

# Sampling interval while in REST2 state (medium sleep)
CONFIG_PMW3389_REST2_SAMPLE_TIME_MS=200

# Sampling interval while in REST3 state (deep sleep)
CONFIG_PMW3389_REST3_SAMPLE_TIME_MS=300

# --- Downshift Timers ---
# Time before transitioning from RUN → REST1
CONFIG_PMW3389_RUN_DOWNSHIFT_TIME_MS=500

# Time before transitioning REST1 → REST2
CONFIG_PMW3389_REST1_DOWNSHIFT_TIME_MS=3000

# Time before transitioning REST2 → REST3
CONFIG_PMW3389_REST2_DOWNSHIFT_TIME_MS=30000
